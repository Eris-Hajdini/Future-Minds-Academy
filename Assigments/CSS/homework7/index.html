    <title>Document</title>

        .the-card{
            border: 2px solid black;
            width: 20rem;

            justify-content: start;

            font-size: 3rem;
        }
        .date{

            flex-direction: column;

            flex-grow: 1;
            height: 170px;
            width: 130px;
            font-size: 1rem;
        }
        .image-card{

            justify-content: start;
            height: 1500px;
            width: 1200px;
        }

    </style>
</head>
